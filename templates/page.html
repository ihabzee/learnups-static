<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1A3A8F;
    --navy-mid: #1E4FC2;
    --navy-light: #2563EB;
    --amber: #F5A623;
    --amber-light: #FBBF24;
    --amber-pale: #FEF3D7;
    --white: #FFFFFF;
    --off-white: #FAFAF8;
    --gray-50: #F8F7F4;
    --gray-100: #EDEBE4;
    --gray-300: #C8C4B8;
    --gray-500: #888275;
    --gray-700: #4A4540;
    --gray-900: #1C1917;
    --green: #16A34A;
    --green-pale: #DCFCE7;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --radius: 12px;
    --radius-lg: 20px;
    --shadow: 0 4px 24px rgba(11,20,55,0.10);
    --shadow-lg: 0 12px 48px rgba(11,20,55,0.16);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--off-white);
    color: var(--gray-900);
    font-size: 16px;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-100);
  }
  .nav-inner {
    max-width: 1160px; margin: 0 auto;
    display: flex; align-items: center; gap: 2rem;
    padding: 0 2rem; height: 84px;
  }
  .logo {
    font-family: var(--serif); font-size: 1.5rem; font-weight: 700;
    color: var(--navy); text-decoration: none; letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); display: inline-block; margin-bottom: 2px; }
  .nav-links { display: flex; gap: 1.75rem; margin-left: auto; }
  .nav-links a {
    font-size: 0.875rem; font-weight: 400; color: var(--gray-700);
    text-decoration: none; transition: color .2s;
  }
  .nav-links a:hover { color: var(--navy); }
  .nav-cta { display: flex; gap: 10px; align-items: center; }
  .btn-ghost {
    font-family: var(--sans); font-size: 0.875rem; font-weight: 500;
    color: var(--navy); background: none; border: 1.5px solid var(--gray-300);
    border-radius: 8px; padding: 7px 18px; cursor: pointer; text-decoration: none;
    transition: all .2s;
  }
  .btn-ghost:hover { border-color: var(--navy); background: var(--gray-50); }
  .btn-primary {
    font-family: var(--sans); font-size: 0.875rem; font-weight: 500;
    color: var(--navy); background: var(--amber); border: none;
    border-radius: 8px; padding: 8px 20px; cursor: pointer; text-decoration: none;
    transition: all .2s;
  }
  .btn-primary:hover { background: var(--amber-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(232,160,32,0.35); }

  /* ── HERO ── */
  .hero {
    background: var(--navy);
    padding: 110px 2rem 90px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(232,160,32,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 10% 80%, rgba(30,58,138,0.6) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-grid {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .hero-inner {
    max-width: 1160px; margin: 0 auto;
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 420px; gap: 4rem; align-items: center;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(232,160,32,0.15); border: 1px solid rgba(232,160,32,0.35);
    border-radius: 100px; padding: 5px 14px;
    font-size: 0.75rem; font-weight: 500; color: var(--amber-light);
    letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 1.5rem;
  }
  .hero-badge::before { content: '●'; font-size: 8px; }
  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    font-weight: 700; line-height: 1.15;
    color: var(--white); letter-spacing: -1px;
    margin-bottom: 1.25rem;
  }
  .hero h1 em {
    font-style: normal; color: var(--amber);
    text-decoration: underline; text-decoration-color: rgba(232,160,32,0.4);
    text-underline-offset: 6px;
  }
  .hero-sub {
    font-size: 1.1rem; font-weight: 300; color: rgba(255,255,255,0.70);
    max-width: 520px; line-height: 1.75; margin-bottom: 2.5rem;
  }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-hero-primary {
    font-family: var(--sans); font-size: 1rem; font-weight: 500;
    color: var(--navy); background: var(--amber);
    border: none; border-radius: 10px; padding: 13px 28px;
    cursor: pointer; text-decoration: none; transition: all .2s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-hero-primary:hover { background: var(--amber-light); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,160,32,0.40); }
  .btn-hero-outline {
    font-family: var(--sans); font-size: 1rem; font-weight: 400;
    color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px; padding: 13px 28px;
    cursor: pointer; text-decoration: none; transition: all .2s;
  }
  .btn-hero-outline:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.4); }
  .hero-stats {
    display: flex; gap: 2rem; margin-top: 3rem;
    padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .stat-item { }
  .stat-num {
    font-family: var(--serif); font-size: 1.9rem; font-weight: 700;
    color: var(--white); line-height: 1.1;
  }
  .stat-num span { color: var(--amber); }
  .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 2px; letter-spacing: 0.03em; }

  /* Hero card / visual */
  .hero-visual {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    backdrop-filter: blur(8px);
  }
  .hv-title {
    font-size: 0.75rem; font-weight: 500; color: rgba(255,255,255,0.45);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.25rem;
  }
  .question-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 10px;
  }
  .question-card .q-label {
    font-size: 0.7rem; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--amber); margin-bottom: 6px;
  }
  .question-card .q-text {
    font-size: 0.875rem; color: rgba(255,255,255,0.85); line-height: 1.5;
  }
  .q-options { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .q-option {
    display: flex; align-items: center; gap: 9px;
    font-size: 0.8rem; color: rgba(255,255,255,0.65);
  }
  .q-option .radio {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.3); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .q-option.selected .radio {
    border-color: var(--amber); background: var(--amber);
  }
  .q-option.selected .radio::after {
    content: ''; width: 5px; height: 5px;
    border-radius: 50%; background: var(--navy);
  }
  .q-option.selected { color: rgba(255,255,255,0.9); }
  .progress-row {
    display: flex; align-items: center; gap: 10px; margin-top: 1rem;
  }
  .progress-bar-track {
    flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px;
  }
  .progress-bar-fill { height: 100%; width: 65%; background: var(--amber); border-radius: 4px; }
  .progress-label { font-size: 0.75rem; color: rgba(255,255,255,0.4); }
  .grade-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(22,163,74,0.2); border: 1px solid rgba(22,163,74,0.4);
    color: #4ADE80; border-radius: 6px;
    padding: 3px 10px; font-size: 0.75rem; font-weight: 500; margin-top: 8px;
  }

  /* ── LOGOS / TRUST BAR ── */
  .trust-bar {
    background: var(--white);
    border-bottom: 1px solid var(--gray-100);
    padding: 1.5rem 2rem;
    text-align: center;
  }
  .trust-bar p {
    font-size: 0.78rem; font-weight: 500; color: var(--gray-500);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1.25rem;
  }
  .trust-logos {
    display: flex; align-items: center; justify-content: center; gap: 2.5rem; flex-wrap: wrap;
  }
  .trust-logo {
    font-size: 0.9rem; font-weight: 500; color: var(--gray-300);
    letter-spacing: 0.03em; white-space: nowrap;
  }

  /* ── SECTION LAYOUT ── */
  .section { padding: 96px 2rem; }
  .section-alt { background: var(--white); }
  .section-dark { background: var(--navy); color: var(--white); }
  .container { max-width: 1160px; margin: 0 auto; }
  .section-tag {
    display: inline-block;
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--amber);
    background: var(--amber-pale); border-radius: 100px;
    padding: 4px 14px; margin-bottom: 1rem;
  }
  .section-dark .section-tag {
    background: rgba(232,160,32,0.15); color: var(--amber-light);
  }
  .section-title {
    font-family: var(--serif);
    font-size: clamp(1.9rem, 3.5vw, 2.8rem);
    font-weight: 700; line-height: 1.2;
    color: var(--navy); letter-spacing: -0.5px;
    margin-bottom: 0.85rem;
  }
  .section-dark .section-title { color: var(--white); }
  .section-sub {
    font-size: 1.05rem; font-weight: 300; color: var(--gray-500);
    max-width: 600px; line-height: 1.75;
  }
  .section-dark .section-sub { color: rgba(255,255,255,0.6); }
  .section-header { margin-bottom: 3.5rem; }
  .section-header.centered { text-align: center; }
  .section-header.centered .section-sub { margin: 0 auto; }

  /* ── FEATURE CARDS ── */
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }
  .feature-card {
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    transition: all .25s;
    position: relative; overflow: hidden;
  }
  .feature-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: transparent; transition: background .25s;
  }
  .feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
  .feature-card:hover::before { background: var(--amber); }
  .feature-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--amber-pale); display: flex; align-items: center;
    justify-content: center; font-size: 20px; margin-bottom: 1.25rem;
  }
  .feature-card h3 {
    font-family: var(--serif); font-size: 1.15rem; font-weight: 700;
    color: var(--navy); margin-bottom: 0.5rem; line-height: 1.3;
  }
  .feature-card p { font-size: 0.9rem; color: var(--gray-500); line-height: 1.7; }

  /* ── HOW IT WORKS ── */
  .steps { display: flex; flex-direction: column; gap: 0; }
  .step {
    display: grid; grid-template-columns: 80px 1fr; gap: 0;
    position: relative;
  }
  .step:not(:last-child) .step-line {
    position: absolute; left: 39px; top: 60px; bottom: 0;
    width: 1px; background: var(--gray-100);
  }
  .step-num-col { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .step-num {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--navy); color: var(--white);
    font-family: var(--serif); font-size: 1.1rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; z-index: 1;
  }
  .step-content { padding: 0 0 3rem 0; }
  .step-content h3 {
    font-family: var(--serif); font-size: 1.3rem; font-weight: 700;
    color: var(--navy); margin-bottom: 0.5rem; line-height: 1.3;
  }
  .step-content p { font-size: 0.95rem; color: var(--gray-500); max-width: 520px; line-height: 1.75; }
  .step-tag {
    display: inline-block; font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--amber-pale); color: #92600A;
    padding: 3px 10px; border-radius: 100px; margin-bottom: 8px;
  }

  /* ── AUDIENCE SPLIT ── */
  .audience-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
  .audience-card-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
  .audience-card {
    border-radius: var(--radius-lg); padding: 2.5rem;
    position: relative; overflow: hidden;
  }
  .audience-card.educators { background: var(--navy); color: var(--white); }
  .audience-card.students { background: var(--amber-pale); color: var(--navy); }
  .audience-label {
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .educators .audience-label { color: var(--amber); }
  .students .audience-label { color: #92600A; }
  .audience-card h2 {
    font-family: var(--serif); font-size: 1.7rem; font-weight: 700;
    line-height: 1.25; margin-bottom: 1rem;
  }
  .educators h2 { color: var(--white); }
  .students h2 { color: var(--navy); }
  .audience-card p { font-size: 0.9rem; line-height: 1.75; margin-bottom: 1.5rem; }
  .educators p { color: rgba(255,255,255,0.7); }
  .students p { color: #5A4010; }
  .check-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.75rem; }
  .check-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 0.875rem; }
  .educators .check-list li { color: rgba(255,255,255,0.8); }
  .students .check-list li { color: #5A4010; }
  .check-icon {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center; font-size: 10px;
  }
  .educators .check-icon { background: rgba(232,160,32,0.25); color: var(--amber); }
  .students .check-icon { background: rgba(11,20,55,0.1); color: var(--navy); }
  .btn-audience-ed {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--sans); font-size: 0.9rem; font-weight: 500;
    color: var(--navy); background: var(--amber);
    border: none; border-radius: 9px; padding: 11px 22px;
    cursor: pointer; text-decoration: none; transition: all .2s;
  }
  .btn-audience-ed:hover { background: var(--amber-light); }
  .btn-audience-st {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--sans); font-size: 0.9rem; font-weight: 500;
    color: var(--white); background: var(--navy);
    border: none; border-radius: 9px; padding: 11px 22px;
    cursor: pointer; text-decoration: none; transition: all .2s;
  }
  .btn-audience-st:hover { background: var(--navy-mid); }

  /* ── INTEGRATION STRIP ── */
  .integration-strip {
    background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy) 100%);
    padding: 56px 2rem; text-align: center;
  }
  .integration-strip h2 {
    font-family: var(--serif); font-size: 2rem; font-weight: 700;
    color: var(--white); margin-bottom: 0.75rem;
  }
  .integration-strip p { color: rgba(255,255,255,0.6); font-size: 1rem; margin-bottom: 2rem; }
  .integration-badges { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .int-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 100px; padding: 9px 20px;
    font-size: 0.85rem; font-weight: 500; color: rgba(255,255,255,0.85);
  }
  .int-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }

  /* ── PRICING ── */
  .pricing-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; align-items: start; max-width: 860px; margin: 0 auto; }
  .pricing-card {
    background: var(--white); border: 1px solid var(--gray-100);
    border-radius: var(--radius-lg); padding: 2rem;
    transition: all .25s;
  }
  .pricing-card.featured {
    background: var(--navy); border-color: var(--navy);
    transform: scale(1.03);
  }
  .pricing-card:not(.featured):hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .plan-label {
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--gray-500); margin-bottom: 0.75rem;
  }
  .featured .plan-label { color: var(--amber); }
  .plan-name {
    font-family: var(--serif); font-size: 1.4rem; font-weight: 700;
    color: var(--navy); margin-bottom: 0.75rem;
  }
  .featured .plan-name { color: var(--white); }
  .plan-price {
    display: flex; align-items: baseline; gap: 4px; margin-bottom: 0.5rem;
  }
  .plan-price .amount {
    font-family: var(--serif); font-size: 2.5rem; font-weight: 900;
    color: var(--navy); letter-spacing: -1px;
  }
  .featured .plan-price .amount { color: var(--amber); }
  .plan-price .period { font-size: 0.85rem; color: var(--gray-500); }
  .featured .plan-price .period { color: rgba(255,255,255,0.5); }
  .plan-desc { font-size: 0.85rem; color: var(--gray-500); margin-bottom: 1.5rem; line-height: 1.6; }
  .featured .plan-desc { color: rgba(255,255,255,0.6); }
  .plan-features { list-style: none; display: flex; flex-direction: column; gap: 9px; margin-bottom: 1.75rem; }
  .plan-features li { display: flex; align-items: flex-start; gap: 9px; font-size: 0.85rem; color: var(--gray-700); }
  .featured .plan-features li { color: rgba(255,255,255,0.8); }
  .plan-features li::before { content: '✓'; color: var(--green); font-weight: 700; flex-shrink: 0; }
  .featured .plan-features li::before { color: var(--amber); }
  .divider-line { border: none; border-top: 1px solid var(--gray-100); margin: 1.25rem 0; }
  .featured .divider-line { border-color: rgba(255,255,255,0.1); }
  .btn-plan {
    display: block; width: 100%; text-align: center;
    font-family: var(--sans); font-size: 0.9rem; font-weight: 500;
    background: var(--gray-100); color: var(--navy);
    border: none; border-radius: 9px; padding: 12px;
    cursor: pointer; text-decoration: none; transition: all .2s;
  }
  .btn-plan:hover { background: var(--gray-300); }
  .btn-plan-featured {
    display: block; width: 100%; text-align: center;
    font-family: var(--sans); font-size: 0.9rem; font-weight: 500;
    background: var(--amber); color: var(--navy);
    border: none; border-radius: 9px; padding: 12px;
    cursor: pointer; text-decoration: none; transition: all .2s;
  }
  .btn-plan-featured:hover { background: var(--amber-light); }
  .popular-badge {
    display: inline-block; background: var(--amber); color: var(--navy);
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 100px; margin-bottom: 0.75rem;
  }

  /* ── TESTIMONIALS ── */
  .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
  .testimonial {
    background: var(--white); border: 1px solid var(--gray-100);
    border-radius: var(--radius-lg); padding: 1.75rem;
  }
  .testimonial .quote {
    font-family: var(--serif); font-size: 1.05rem; font-style: italic;
    color: var(--navy); line-height: 1.65; margin-bottom: 1.25rem;
  }
  .testimonial-author { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--navy); color: var(--amber);
    font-family: var(--serif); font-size: 0.85rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .author-name { font-size: 0.85rem; font-weight: 500; color: var(--navy); }
  .author-role { font-size: 0.78rem; color: var(--gray-500); }
  .stars { color: var(--amber); font-size: 12px; margin-bottom: 1rem; }

  /* ── CTA BANNER ── */
  .cta-banner {
    background: var(--amber);
    padding: 80px 2rem; text-align: center;
  }
  .cta-banner h2 {
    font-family: var(--serif); font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    font-weight: 700; color: var(--navy); margin-bottom: 1rem; letter-spacing: -0.5px;
  }
  .cta-banner p { font-size: 1.05rem; color: rgba(11,20,55,0.7); margin-bottom: 2rem; }
  .cta-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-cta-dark {
    font-family: var(--sans); font-size: 1rem; font-weight: 500;
    color: var(--white); background: var(--navy);
    border: none; border-radius: 10px; padding: 14px 30px;
    cursor: pointer; text-decoration: none; transition: all .2s;
  }
  .btn-cta-dark:hover { background: var(--navy-mid); transform: translateY(-1px); }
  .btn-cta-outline {
    font-family: var(--sans); font-size: 1rem; font-weight: 500;
    color: var(--navy); background: transparent;
    border: 2px solid rgba(11,20,55,0.35); border-radius: 10px; padding: 13px 30px;
    cursor: pointer; text-decoration: none; transition: all .2s;
  }
  .btn-cta-outline:hover { border-color: var(--navy); background: rgba(11,20,55,0.05); }

  /* ── FOOTER ── */
  footer {
    background: var(--gray-900); color: rgba(255,255,255,0.6);
    padding: 56px 2rem 32px;
  }
  .footer-inner { max-width: 1160px; margin: 0 auto; }
  .footer-top { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 3rem; margin-bottom: 3rem; }
  .footer-brand .logo { color: var(--white); }
  .footer-brand p { font-size: 0.875rem; color: rgba(255,255,255,0.45); margin-top: 0.75rem; line-height: 1.7; }
  .footer-col h4 { font-size: 0.8rem; font-weight: 500; color: var(--white); letter-spacing: 0.05em; margin-bottom: 1rem; text-transform: uppercase; }
  .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .footer-col ul li a { font-size: 0.875rem; color: rgba(255,255,255,0.45); text-decoration: none; transition: color .2s; }
  .footer-col ul li a:hover { color: rgba(255,255,255,0.85); }
  .footer-bottom {
    border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1.5rem;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.8rem;
  }
  .footer-bottom a { color: rgba(255,255,255,0.4); text-decoration: none; }
  .footer-bottom a:hover { color: rgba(255,255,255,0.7); }

  /* ── QUESTION TYPE PILLS ── */
  .qt-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.5rem; }
  .qt-pill {
    font-size: 0.78rem; font-weight: 500; padding: 5px 13px;
    border-radius: 100px; background: var(--navy); color: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hero-content > * { animation: fadeUp .6s ease both; }
  .hero-badge { animation-delay: .1s; }
  .hero h1 { animation-delay: .2s; }
  .hero-sub { animation-delay: .3s; }
  .hero-actions { animation-delay: .4s; }
  .hero-stats { animation-delay: .5s; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .hero-inner { grid-template-columns: 1fr; }
    .hero-visual { display: none; }
    .feature-grid { grid-template-columns: 1fr 1fr; }
    .audience-card-inner { grid-template-columns: 1fr; }
    .pricing-grid { grid-template-columns: 1fr; }
    .pricing-card.featured { transform: none; }
    .testimonials-grid { grid-template-columns: 1fr; }
    .footer-top { grid-template-columns: 1fr 1fr; }
    .nav-links { display: none; }
  }
  @media (max-width: 600px) {
    .feature-grid { grid-template-columns: 1fr; }
    .footer-top { grid-template-columns: 1fr; }
    .hero-stats { gap: 1.25rem; }
  }
  /* ── CUSTOM PAGE ── */
  .page-body {
    max-width: 780px; margin: 0 auto; padding: 4rem 1.5rem 5rem;
  }
  .page-body h1 { font-family: var(--serif); font-size: 2.2rem; font-weight: 700; color: var(--navy); margin-bottom: 1.25rem; line-height: 1.2; }
  .page-body h2 { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; color: var(--navy); margin: 2rem 0 0.75rem; }
  .page-body h3 { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; color: var(--navy); margin: 1.5rem 0 0.5rem; }
  .page-body p { font-size: 0.95rem; line-height: 1.8; color: var(--gray-700); margin-bottom: 1rem; }
  .page-body ul, .page-body ol { padding-left: 1.5rem; margin-bottom: 1rem; }
  .page-body li { font-size: 0.95rem; line-height: 1.75; color: var(--gray-700); margin-bottom: 0.25rem; }
  .page-body a { color: var(--navy-light); text-decoration: underline; }
  .page-body a:hover { color: var(--navy); }
  .page-body hr { border: none; border-top: 1px solid var(--gray-100); margin: 2rem 0; }
  .page-body blockquote { border-left: 3px solid var(--amber); padding: 0.75rem 1.25rem; background: var(--amber-pale); border-radius: 0 8px 8px 0; margin: 1.5rem 0; }
  .page-body blockquote p { color: #92600A; margin: 0; }
</style>
</head>

<main class="page-body">
  {{ page.body | safe }}
